default_language_version:
  node: 22.17.0
repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0 # Replace by any tag/version: https://github.com/psf/black/tags
    hooks:
      - id: black
        # Assumes that your shell's `python` command is linked to python3.6+
        language_version: python
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        exclude: \.html$
        # exclude django templates, which prettier does not support
  - repo: https://github.com/rtts/djhtml
    rev: 3.0.6
    hooks:
      - id: djhtml
  - repo: local
    hooks:
      - id: no-entities-in-corpus
        name: geniza.corpus must not depend on geniza.entities
        language: pygrep
        entry: '^(from|import) geniza\.entities|"entities",'
        files: ^geniza/corpus/.*\.py$
